<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="520"
     viewBox="0 0 1200 520">

  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914" />
      <stop offset="45%" stop-color="#091528" />
      <stop offset="100%" stop-color="#050C18" />
    </linearGradient>

    <!-- Arc Glow Gradient -->
    <linearGradient id="arcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- T-Stem Gradient -->
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- R-Stem Gradient -->
    <linearGradient id="rGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Badge Background -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E223D" />
      <stop offset="100%" stop-color="#071424" />
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="1200" height="520" rx="18" fill="url(#bgGrad)" stroke="#1E3A5F" stroke-width="1.5" />

  <!-- Technical Grid System -->
  <g stroke="#162B48" stroke-width="0.75" opacity="0.45">
    <!-- Vertical Grid -->
    <line x1="60" y1="0" x2="60" y2="520" />
    <line x1="120" y1="0" x2="120" y2="520" />
    <line x1="180" y1="0" x2="180" y2="520" />
    <line x1="240" y1="0" x2="240" y2="520" stroke="#0284C7" stroke-width="1" opacity="0.3" />
    <line x1="300" y1="0" x2="300" y2="520" />
    <line x1="360" y1="0" x2="360" y2="520" />
    <line x1="420" y1="0" x2="420" y2="520" />
    <line x1="480" y1="0" x2="480" y2="520" stroke="#0284C7" stroke-width="1" opacity="0.3" />
    <line x1="540" y1="0" x2="540" y2="520" />
    <line x1="600" y1="0" x2="600" y2="520" stroke="#38BDF8" stroke-width="1.2" opacity="0.35" />
    <line x1="660" y1="0" x2="660" y2="520" />
    <line x1="720" y1="0" x2="720" y2="520" stroke="#0284C7" stroke-width="1" opacity="0.3" />
    <line x1="780" y1="0" x2="780" y2="520" />
    <line x1="840" y1="0" x2="840" y2="520" />
    <line x1="900" y1="0" x2="900" y2="520" />
    <line x1="960" y1="0" x2="960" y2="520" stroke="#0284C7" stroke-width="1" opacity="0.3" />
    <line x1="1020" y1="0" x2="1020" y2="520" />
    <line x1="1080" y1="0" x2="1080" y2="520" />
    <line x1="1140" y1="0" x2="1140" y2="520" />

    <!-- Horizontal Grid -->
    <line x1="0" y1="48" x2="1200" y2="48" stroke="#0284C7" stroke-width="1" opacity="0.35" />
    <line x1="0" y1="96" x2="1200" y2="96" />
    <line x1="0" y1="144" x2="1200" y2="144" />
    <line x1="0" y1="192" x2="1200" y2="192" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#38BDF8" stroke-width="1" opacity="0.25" />
    <line x1="0" y1="288" x2="1200" y2="288" />
    <line x1="0" y1="336" x2="1200" y2="336" stroke="#0284C7" stroke-width="1" opacity="0.3" />
    <line x1="0" y1="384" x2="1200" y2="384" />
    <line x1="0" y1="432" x2="1200" y2="432" stroke="#0284C7" stroke-width="1" opacity="0.35" />
    <line x1="0" y1="480" x2="1200" y2="480" />
  </g>

  <!-- TOP DISCIPLINE PILLS -->
  <g transform="translate(0, 16)">
    <!-- Pill 1: Unity 3D -->
    <g transform="translate(80, 0)">
      <rect width="140" height="26" rx="13" fill="url(#badgeBg)" stroke="#1E3A5F" stroke-width="1" />
      <polygon points="18,13 24,7 30,13 24,19" fill="#38BDF8" opacity="0.9" />
      <text x="38" y="17" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">UNITY 3D</text>
    </g>

    <!-- Pill 2: Real-Time 3D -->
    <g transform="translate(245, 0)">
      <rect width="150" height="26" rx="13" fill="url(#badgeBg)" stroke="#1E3A5F" stroke-width="1" />
      <rect x="18" y="8" width="10" height="10" fill="none" stroke="#38BDF8" stroke-width="1.5" />
      <text x="38" y="17" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">REAL-TIME 3D</text>
    </g>

    <!-- Pill 3: AR / VR -->
    <g transform="translate(420, 0)">
      <rect width="130" height="26" rx="13" fill="url(#badgeBg)" stroke="#1E3A5F" stroke-width="1" />
      <rect x="18" y="9" width="12" height="8" rx="2" fill="none" stroke="#38BDF8" stroke-width="1.5" />
      <text x="38" y="17" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">AR / VR</text>
    </g>

    <!-- Pill 4: Digital Twins -->
    <g transform="translate(575, 0)">
      <rect width="155" height="26" rx="13" fill="url(#badgeBg)" stroke="#1E3A5F" stroke-width="1" />
      <circle cx="23" cy="13" r="3.5" fill="#38BDF8" />
      <circle cx="31" cy="9" r="2" fill="#0284C7" />
      <circle cx="31" cy="17" r="2" fill="#0284C7" />
      <line x1="23" y1="13" x2="31" y2="9" stroke="#38BDF8" stroke-width="1" />
      <line x1="23" y1="13" x2="31" y2="17" stroke="#38BDF8" stroke-width="1" />
      <text x="40" y="17" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">DIGITAL TWINS</text>
    </g>

    <!-- Pill 5: BIM / IFC -->
    <g transform="translate(755, 0)">
      <rect width="135" height="26" rx="13" fill="url(#badgeBg)" stroke="#1E3A5F" stroke-width="1" />
      <path d="M 18 19 L 18 11 L 23 7 L 28 11 L 28 19 Z" fill="none" stroke="#38BDF8" stroke-width="1.5" />
      <text x="36" y="17" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">BIM / IFC</text>
    </g>

    <!-- Pill 6: WebGL -->
    <g transform="translate(915, 0)">
      <rect width="135" height="26" rx="13" fill="url(#badgeBg)" stroke="#1E3A5F" stroke-width="1" />
      <circle cx="24" cy="13" r="5" fill="none" stroke="#38BDF8" stroke-width="1.5" />
      <ellipse cx="24" cy="13" rx="2" ry="5" fill="none" stroke="#38BDF8" stroke-width="1" />
      <text x="38" y="17" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">WEBGL</text>
    </g>
  </g>

  <!-- LEFT GRAPHIC: ARCHITECTURAL BIM & CRANE BLUEPRINT -->
  <g transform="translate(60, 90)" opacity="0.85">
    <!-- Blueprint Lines -->
    <!-- Tower Crane -->
    <line x1="190" y1="20" x2="190" y2="230" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4, 4" />
    <line x1="140" y1="20" x2="270" y2="20" stroke="#38BDF8" stroke-width="2" />
    <line x1="190" y1="5" x2="200" y2="20" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="190" y1="5" x2="170" y2="20" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="140" y1="20" x2="190" y2="5" stroke="#0284C7" stroke-width="1" />
    <line x1="260" y1="20" x2="190" y2="5" stroke="#0284C7" stroke-width="1" />
    <line x1="240" y1="20" x2="240" y2="70" stroke="#60A5FA" stroke-width="1" />
    <circle cx="240" cy="72" r="3" fill="#60A5FA" />

    <!-- Building 1 (Tall Skyscraper Wireframe) -->
    <rect x="40" y="60" width="85" height="170" fill="#0A1E35" stroke="#1E4976" stroke-width="1.5" />
    <!-- Floor Grid -->
    <line x1="40" y1="85" x2="125" y2="85" stroke="#1E4976" stroke-width="0.75" />
    <line x1="40" y1="110" x2="125" y2="110" stroke="#1E4976" stroke-width="0.75" />
    <line x1="40" y1="135" x2="125" y2="135" stroke="#1E4976" stroke-width="0.75" />
    <line x1="40" y1="160" x2="125" y2="160" stroke="#1E4976" stroke-width="0.75" />
    <line x1="40" y1="185" x2="125" y2="185" stroke="#1E4976" stroke-width="0.75" />
    <line x1="40" y1="210" x2="125" y2="210" stroke="#1E4976" stroke-width="0.75" />
    <line x1="68" y1="60" x2="68" y2="230" stroke="#1E4976" stroke-width="0.75" />
    <line x1="97" y1="60" x2="97" y2="230" stroke="#1E4976" stroke-width="0.75" />

    <!-- Building 2 (Mid-Rise BIM Structure) -->
    <rect x="135" y="90" width="105" height="140" fill="#07172B" stroke="#0284C7" stroke-width="1.2" />
    <!-- Cross Bracing -->
    <line x1="135" y1="90" x2="185" y2="135" stroke="#1E3A5F" stroke-width="1" />
    <line x1="185" y1="90" x2="135" y2="135" stroke="#1E3A5F" stroke-width="1" />
    <line x1="185" y1="90" x2="240" y2="135" stroke="#1E3A5F" stroke-width="1" />
    <line x1="240" y1="90" x2="185" y2="135" stroke="#1E3A5F" stroke-width="1" />
    <line x1="135" y1="135" x2="185" y2="180" stroke="#1E3A5F" stroke-width="1" />
    <line x1="185" y1="135" x2="135" y2="180" stroke="#1E3A5F" stroke-width="1" />
    <line x1="185" y1="135" x2="240" y2="180" stroke="#1E3A5F" stroke-width="1" />
    <line x1="240" y1="135" x2="185" y2="180" stroke="#1E3A5F" stroke-width="1" />

    <!-- Pulse Beacon on Building Roof -->
    <circle cx="82" cy="58" r="3" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- RIGHT GRAPHIC: SPATIAL COMPUTING & CONNECTED DATA NODES -->
  <g transform="translate(820, 85)" opacity="0.9">
    <!-- Connected Neural / Global Mesh -->
    <g stroke="#0284C7" stroke-width="1" opacity="0.6">
      <line x1="120" y1="20" x2="190" y2="35" />
      <line x1="190" y1="35" x2="260" y2="20" />
      <line x1="190" y1="35" x2="170" y2="80" />
      <line x1="120" y1="20" x2="80" y2="60" />
      <line x1="80" y1="60" x2="170" y2="80" />
      <line x1="170" y1="80" x2="240" y2="70" />
      <line x1="260" y1="20" x2="240" y2="70" />
      <line x1="240" y1="70" x2="280" y2="90" />
    </g>

    <!-- Pulsing Mesh Nodes -->
    <circle cx="120" cy="20" r="4" fill="#38BDF8" />
    <circle cx="190" cy="35" r="5" fill="#60A5FA" />
    <circle cx="260" cy="20" r="4" fill="#38BDF8" />
    <circle cx="80" cy="60" r="3.5" fill="#0284C7" />
    <circle cx="170" cy="80" r="4.5" fill="#38BDF8" />
    <circle cx="240" cy="70" r="4" fill="#0284C7" />
    <circle cx="280" cy="90" r="3" fill="#60A5FA" />

    <!-- Floating Holographic Analytics Card -->
    <g transform="translate(20, 95)">
      <rect width="180" height="110" rx="6" fill="#061A30" stroke="#0284C7" stroke-width="1.2" opacity="0.85" />
      <line x1="10" y1="22" x2="170" y2="22" stroke="#1E3A5F" stroke-width="1" />
      <text x="14" y="16" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="9" font-weight="700" letter-spacing="1">SYSTEM TELEMETRY</text>
      <circle cx="162" cy="14" r="3" fill="#10B981">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite" />
      </circle>

      <!-- Mini Chart Bars -->
      <rect x="20" y="65" width="12" height="30" fill="#0284C7" />
      <rect x="40" y="45" width="12" height="50" fill="#38BDF8" />
      <rect x="60" y="55" width="12" height="40" fill="#0284C7" />
      <rect x="80" y="35" width="12" height="60" fill="#60A5FA" />
      <rect x="100" y="50" width="12" height="45" fill="#38BDF8" />

      <!-- Circular Radar / Gauge -->
      <circle cx="145" cy="60" r="20" fill="none" stroke="#1E3A5F" stroke-width="2" />
      <circle cx="145" cy="60" r="20" fill="none" stroke="#00D2FF" stroke-width="2" stroke-dasharray="80, 45">
        <animate attributeName="stroke-dashoffset" values="125;-125" dur="4s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Stylized VR / Spatial Engineer Silhouette -->
    <g transform="translate(195, 95)" opacity="0.95">
      <!-- Head and Goggles -->
      <path d="M 40 40 Q 42 20 60 18 Q 78 20 80 40 Q 82 55 60 62 Q 42 55 40 40 Z" fill="#0A2240" stroke="#1E4976" stroke-width="1.2" />
      <!-- VR Goggles / Visor -->
      <rect x="36" y="28" width="30" height="14" rx="4" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite" />
      </rect>
      <!-- Visor Scan Glow -->
      <line x1="38" y1="35" x2="64" y2="35" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8" />
      <!-- Gesturing Arm -->
      <path d="M 38 65 Q 15 70 -5 55 Q -18 45 -35 48" fill="none" stroke="#38BDF8" stroke-width="2" />
      <!-- Finger Interaction Beam -->
      <circle cx="-35" cy="48" r="3.5" fill="#00D2FF">
        <animate attributeName="r" values="3.5;5.5;3.5" dur="1.5s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>

  <!-- CENTER ICONIC MONOGRAM: RT WITH DYNAMIC CUTTING ENERGY ARC -->
  <g transform="translate(420, 60)">
    <!-- 'R' Letterform (Solid Industrial Slate) -->
    <path d="M 40 40 L 130 40 Q 185 40 185 95 Q 185 140 145 150 L 195 240 L 140 240 L 98 160 L 78 160 L 78 240 L 40 240 Z"
          fill="url(#rGrad)" stroke="#475569" stroke-width="2" />
    <path d="M 78 72 L 125 72 Q 148 72 148 95 Q 148 122 125 122 L 78 122 Z"
          fill="#071222" stroke="#1E3A5F" stroke-width="1.5" />

    <!-- 'T' Letterform (Electric Cobalt Blue) -->
    <path d="M 195 40 L 330 40 L 330 75 L 280 75 L 280 240 L 242 240 L 242 75 L 195 75 Z"
          fill="url(#tGrad)" stroke="#38BDF8" stroke-width="1.5" />

    <!-- Dynamic Slicing Energy Arc (Swoosh cutting through R & T) -->
    <path d="M -110 245 C 50 200, 160 130, 360 40 C 270 95, 140 170, -110 245 Z"
          fill="url(#arcGrad)" opacity="0.95" />

    <!-- Animated Arc Laser Beam (SMIL) -->
    <path d="M -110 245 C 50 200, 160 130, 360 40"
          fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="80, 400">
      <animate attributeName="stroke-dashoffset" values="480;-480" dur="2.4s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- CORPORATE WORDMARK & SUBTITLE -->
  <g transform="translate(600, 350)" text-anchor="middle">
    <!-- Main Brand Name -->
    <text y="0" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="9">
      RAZEL<tspan fill="#00D2FF">TECH</tspan>
    </text>

    <!-- Corporate Subtitle -->
    <text y="28" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing="4.5">
      ENGINEERING REALITY. BUILDING <tspan fill="#38BDF8">INTELLIGENCE.</tspan>
    </text>
  </g>

  <!-- BOTTOM DISCIPLINE CHIPS (10 Core Competencies from Image) -->
  <g transform="translate(40, 420)">
    <!-- Base Divider Line -->
    <line x1="0" y1="0" x2="1120" y2="0" stroke="#1E3A5F" stroke-width="1" />

    <g transform="translate(0, 15)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <circle cx="6" cy="11" r="3" fill="#38BDF8" />
        <text x="14" y="15" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" letter-spacing="0.5">SIMULATION</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(105, 0)">
        <circle cx="6" cy="11" r="3" fill="#38BDF8" />
        <text x="14" y="15" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" letter-spacing="0.5">MULTIPLAYER</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(210, 0)">
        <circle cx="6" cy="11" r="3" fill="#38BDF8" />
        <text x="14" y="15" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" letter-spacing="0.5">NETWORK ENG</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(325, 0)">
        <circle cx="6" cy="11" r="3" fill="#38BDF8" />
        <text x="14" y="15" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" letter-spacing="0.5">ENTERPRISE SAAS</text>
      </g>

      <!-- Item 5 -->
      <g transform="translate(455, 0)">
        <circle cx="6" cy="11" r="3" fill="#38BDF8" />
        <text x="14" y="15" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" letter-spacing="0.5">CUSTOM DEV</text>
      </g>

      <!-- Item 6 -->
      <g transform="translate(565, 0)">
        <circle cx="6" cy="11" r="3" fill="#38BDF8" />
        <text x="14" y="15" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" letter-spacing="0.5">SOFTWARE ARCH</text>
      </g>

      <!-- Item 7 -->
      <g transform="translate(690, 0)">
        <circle cx="6" cy="11" r="3" fill="#38BDF8" />
        <text x="14" y="15" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" letter-spacing="0.5">SYSTEMS ARCH</text>
      </g>

      <!-- Item 8 -->
      <g transform="translate(810, 0)">
        <circle cx="6" cy="11" r="3" fill="#38BDF8" />
        <text x="14" y="15" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" letter-spacing="0.5">AUTOMATION</text>
      </g>

      <!-- Item 9 -->
      <g transform="translate(925, 0)">
        <circle cx="6" cy="11" r="3" fill="#38BDF8" />
        <text x="14" y="15" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" letter-spacing="0.5">SPATIAL COMP</text>
      </g>

      <!-- Item 10 -->
      <g transform="translate(1035, 0)">
        <circle cx="6" cy="11" r="3" fill="#38BDF8" />
        <text x="14" y="15" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" letter-spacing="0.5">3D VISUALS</text>
      </g>
    </g>
  </g>

  <!-- BOTTOM FOOTER TAGLINE -->
  <g transform="translate(600, 485)" text-anchor="middle">
    <text fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="3.5">
      REAL-TIME TECHNOLOGIES // INTELLIGENT SOLUTIONS // LIMITLESS POSSIBILITIES
    </text>
  </g>
</svg>