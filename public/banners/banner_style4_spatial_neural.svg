<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="spaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05081A" />
      <stop offset="50%" stop-color="#0B1333" />
      <stop offset="100%" stop-color="#05081A" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <rect width="1200" height="520" rx="16" fill="url(#spaBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- 3D Isometric Lattice Mesh -->
  <g stroke="#312E81" stroke-width="0.75" opacity="0.5">
    <line x1="150" y1="60" x2="250" y2="120" />
    <line x1="250" y1="120" x2="200" y2="240" />
    <line x1="200" y1="240" x2="100" y2="180" />
    <line x1="100" y1="180" x2="150" y2="60" />
    <line x1="150" y1="60" x2="200" y2="240" stroke="#6366F1" stroke-width="1" />
    
    <line x1="950" y1="60" x2="1050" y2="120" />
    <line x1="1050" y1="120" x2="1000" y2="240" />
    <line x1="1000" y1="240" x2="900" y2="180" />
    <line x1="900" y1="180" x2="950" y2="60" />
    <line x1="950" y1="60" x2="1000" y2="240" stroke="#06B6D4" stroke-width="1" />
  </g>

  <!-- Pulsing Lattice Spheres -->
  <circle cx="150" cy="60" r="5" fill="#06B6D4"><animate attributeName="r" values="5;7.5;5" dur="2s" repeatCount="indefinite" /></circle>
  <circle cx="250" cy="120" r="4.5" fill="#6366F1" />
  <circle cx="200" cy="240" r="6" fill="#06B6D4" />
  <circle cx="100" cy="180" r="4" fill="#818CF8" />

  <circle cx="950" cy="60" r="5" fill="#818CF8" />
  <circle cx="1050" cy="120" r="4.5" fill="#06B6D4" />
  <circle cx="1000" cy="240" r="6" fill="#6366F1"><animate attributeName="r" values="6;8.5;6" dur="2.2s" repeatCount="indefinite" /></circle>
  <circle cx="900" cy="180" r="4" fill="#06B6D4" />

  <!-- Center RT Monogram in Cyber Indigo/Cyan -->
  <g transform="translate(435, 60)">
    <path d="M 40 40 L 130 40 Q 185 40 185 95 Q 185 140 145 150 L 195 240 L 140 240 L 98 160 L 78 160 L 78 240 L 40 240 Z"
          fill="#1E1B4B" stroke="#4338CA" stroke-width="2" />
    <path d="M 78 72 L 125 72 Q 148 72 148 95 Q 148 122 125 122 L 78 122 Z"
          fill="#090A1A" stroke="#312E81" stroke-width="1.2" />

    <path d="M 195 40 L 330 40 L 330 75 L 280 75 L 280 240 L 242 240 L 242 75 L 195 75 Z"
          fill="url(#neonCyan)" stroke="#38BDF8" stroke-width="1.5" />

    <path d="M -110 245 C 50 195, 160 125, 360 35" fill="none" stroke="#06B6D4" stroke-width="3" stroke-dasharray="90, 420">
      <animate attributeName="stroke-dashoffset" values="510;-510" dur="2.6s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Typography -->
  <g transform="translate(600, 360)" text-anchor="middle">
    <text y="0" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="9">RAZEL<tspan fill="#06B6D4">TECH</tspan></text>
    <text y="28" fill="#C7D2FE" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="4">SPATIAL COMPUTING // REAL-TIME WEBGL // PROCEDURAL WEBAUDIO</text>
  </g>

  <!-- Bottom Matrix -->
  <g transform="translate(600, 440)" text-anchor="middle">
    <text fill="#818CF8" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="2">
      THREE.JS WEBGL2 &bull; WEBRTC MULTIPLAYER &bull; MEDIAPIPE AI SPATIAL TRACKING &bull; PROCEDURAL DSP ENGINES
    </text>
  </g>
</svg>