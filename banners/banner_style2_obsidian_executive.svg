<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="obsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020408" />
      <stop offset="50%" stop-color="#060A12" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#080D1A" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="laserCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <rect width="1200" height="520" rx="16" fill="url(#obsBg)" stroke="#1F2937" stroke-width="1.5" />

  <!-- Subtle Executive Grid -->
  <g stroke="#1F2937" stroke-width="0.6" opacity="0.3">
    <line x1="100" y1="0" x2="100" y2="520" />
    <line x1="300" y1="0" x2="300" y2="520" stroke="#0284C7" stroke-width="0.8" opacity="0.4" />
    <line x1="600" y1="0" x2="600" y2="520" stroke="#38BDF8" stroke-width="1" opacity="0.5" />
    <line x1="900" y1="0" x2="900" y2="520" stroke="#0284C7" stroke-width="0.8" opacity="0.4" />
    <line x1="1100" y1="0" x2="1100" y2="520" />
    <line x1="0" y1="50" x2="1200" y2="50" stroke="#0284C7" stroke-width="0.8" opacity="0.4" />
    <line x1="0" y1="260" x2="1200" y2="260" stroke="#38BDF8" stroke-width="0.8" opacity="0.3" />
    <line x1="0" y1="470" x2="1200" y2="470" stroke="#0284C7" stroke-width="0.8" opacity="0.4" />
  </g>

  <!-- Top Credential Bar -->
  <g transform="translate(40, 20)">
    <rect width="250" height="24" rx="4" fill="url(#glassCard)" stroke="#374151" stroke-width="0.8" />
    <circle cx="12" cy="12" r="3" fill="#10B981"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" /></circle>
    <text x="24" y="16" fill="#F3F4F6" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="1">MSME CERTIFIED // GOVT OF INDIA</text>

    <text x="1120" y="16" text-anchor="end" fill="#9CA3AF" font-family="ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="1.5">DEFENSE &amp; ENTERPRISE SYSTEMS STUDIO</text>
  </g>

  <!-- Central RT Monogram with Obsidian Metallic Aesthetic -->
  <g transform="translate(435, 75)">
    <path d="M 40 40 L 130 40 Q 185 40 185 95 Q 185 140 145 150 L 195 240 L 140 240 L 98 160 L 78 160 L 78 240 L 40 240 Z"
          fill="#111827" stroke="#4B5563" stroke-width="2" />
    <path d="M 78 72 L 125 72 Q 148 72 148 95 Q 148 122 125 122 L 78 122 Z"
          fill="#030712" stroke="#1F2937" stroke-width="1.2" />

    <path d="M 195 40 L 330 40 L 330 75 L 280 75 L 280 240 L 242 240 L 242 75 L 195 75 Z"
          fill="#0284C7" stroke="#38BDF8" stroke-width="1.5" />

    <!-- Pure Platinum Laser Arc -->
    <path d="M -120 245 C 50 195, 160 125, 360 35" fill="none" stroke="url(#laserCyan)" stroke-width="3" stroke-linecap="round" />
    <path d="M -120 245 C 50 195, 160 125, 360 35" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="90, 420">
      <animate attributeName="stroke-dashoffset" values="510;-510" dur="2.5s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Left: Metric Pillar 1 -->
  <g transform="translate(70, 115)">
    <rect width="260" height="180" rx="8" fill="url(#glassCard)" stroke="#1F2937" stroke-width="1" />
    <text x="20" y="32" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="1.5">DEFENSE SIMULATION</text>
    <text x="20" y="65" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">10+ Tactical</text>
    <text x="20" y="90" fill="#9CA3AF" font-family="-apple-system, sans-serif" font-size="12">Multi-User Simulators Delivered</text>
    <line x1="20" y1="110" x2="240" y2="110" stroke="#1F2937" stroke-width="1" />
    <text x="20" y="132" fill="#E5E7EB" font-family="ui-monospace, monospace" font-size="10.5">HLA / RTI Protocol &bull; Portico</text>
    <text x="20" y="152" fill="#E5E7EB" font-family="ui-monospace, monospace" font-size="10.5">3DOF &bull; 6DOF Motion Platforms</text>
  </g>

  <!-- Right: Metric Pillar 2 -->
  <g transform="translate(870, 115)">
    <rect width="260" height="180" rx="8" fill="url(#glassCard)" stroke="#1F2937" stroke-width="1" />
    <text x="20" y="32" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="1.5">PRODUCTION SYSTEMS</text>
    <text x="20" y="65" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">25+ Live Apps</text>
    <text x="20" y="90" fill="#9CA3AF" font-family="-apple-system, sans-serif" font-size="12">WebGL, PWA &amp; Enterprise SaaS</text>
    <line x1="20" y1="110" x2="240" y2="110" stroke="#1F2937" stroke-width="1" />
    <text x="20" y="132" fill="#E5E7EB" font-family="ui-monospace, monospace" font-size="10.5">MEDIC &bull; Chess Arena 3D</text>
    <text x="20" y="152" fill="#E5E7EB" font-family="ui-monospace, monospace" font-size="10.5">PURGE &bull; MAHATI &bull; Divya Drusti</text>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(600, 365)" text-anchor="middle">
    <text y="0" fill="#F9FAFB" font-family="-apple-system, sans-serif" font-size="46" font-weight="900" letter-spacing="10">RAZEL<tspan fill="#0284C7">TECH</tspan></text>
    <text y="28" fill="#9CA3AF" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="4">ENGINEERING REALITY // BUILDING <tspan fill="#38BDF8">INTELLIGENCE</tspan></text>
  </g>

  <!-- Bottom Core Capability Stack -->
  <g transform="translate(60, 430)">
    <rect width="1080" height="48" rx="6" fill="url(#glassCard)" stroke="#1F2937" stroke-width="1" />
    <g transform="translate(25, 28)">
      <text x="0" y="0" fill="#E5E7EB" font-family="ui-monospace, monospace" font-size="11" font-weight="700">SIMULATION</text>
      <text x="125" y="0" fill="#0284C7">&bull;</text>
      <text x="145" y="0" fill="#E5E7EB" font-family="ui-monospace, monospace" font-size="11" font-weight="700">MULTIPLAYER</text>
      <text x="270" y="0" fill="#0284C7">&bull;</text>
      <text x="290" y="0" fill="#E5E7EB" font-family="ui-monospace, monospace" font-size="11" font-weight="700">THREE.JS WEBGL</text>
      <text x="445" y="0" fill="#0284C7">&bull;</text>
      <text x="465" y="0" fill="#E5E7EB" font-family="ui-monospace, monospace" font-size="11" font-weight="700">ENTERPRISE SAAS</text>
      <text x="625" y="0" fill="#0284C7">&bull;</text>
      <text x="645" y="0" fill="#E5E7EB" font-family="ui-monospace, monospace" font-size="11" font-weight="700">OFFLINE PWAS</text>
      <text x="785" y="0" fill="#0284C7">&bull;</text>
      <text x="805" y="0" fill="#E5E7EB" font-family="ui-monospace, monospace" font-size="11" font-weight="700">SPATIAL COMPUTING</text>
    </g>
  </g>
</svg>