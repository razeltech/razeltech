<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <rect width="1200" height="520" rx="14" fill="url(#archBg)" stroke="#334155" stroke-width="1.2" />

  <!-- Precision Blueprint Drafting Lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.6">
    <line x1="50" y1="0" x2="50" y2="520" stroke-dasharray="2, 4" />
    <line x1="1150" y1="0" x2="1150" y2="520" stroke-dasharray="2, 4" />
    <line x1="0" y1="40" x2="1200" y2="40" stroke-dasharray="2, 4" />
    <line x1="0" y1="480" x2="1200" y2="480" stroke-dasharray="2, 4" />
  </g>

  <!-- Isometric Box Projection (Left) -->
  <g transform="translate(150, 150)" stroke="#38BDF8" stroke-width="1.2" fill="none">
    <polygon points="50,0 100,28 50,56 0,28" stroke="#0284C7" />
    <polygon points="0,28 50,56 50,112 0,84" />
    <polygon points="50,56 100,28 100,84 50,112" />
  </g>

  <!-- Isometric Box Projection (Right) -->
  <g transform="translate(950, 150)" stroke="#38BDF8" stroke-width="1.2" fill="none">
    <polygon points="50,0 100,28 50,56 0,28" stroke="#0284C7" />
    <polygon points="0,28 50,56 50,112 0,84" />
    <polygon points="50,56 100,28 100,84 50,112" />
  </g>

  <!-- Monogram RT -->
  <g transform="translate(435, 60)">
    <path d="M 40 40 L 130 40 Q 185 40 185 95 Q 185 140 145 150 L 195 240 L 140 240 L 98 160 L 78 160 L 78 240 L 40 240 Z"
          fill="#1E293B" stroke="#64748B" stroke-width="1.5" />
    <path d="M 78 72 L 125 72 Q 148 72 148 95 Q 148 122 125 122 L 78 122 Z"
          fill="#0F172A" stroke="#334155" stroke-width="1" />

    <path d="M 195 40 L 330 40 L 330 75 L 280 75 L 280 240 L 242 240 L 242 75 L 195 75 Z"
          fill="#0284C7" stroke="#38BDF8" stroke-width="1.5" />

    <path d="M -110 245 C 50 195, 160 125, 360 35" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="80, 400">
      <animate attributeName="stroke-dashoffset" values="480;-480" dur="2.8s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Clean Swiss Typography -->
  <g transform="translate(600, 360)" text-anchor="middle">
    <text y="0" fill="#F8FAFC" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="8">RAZEL<tspan fill="#0284C7">TECH</tspan></text>
    <text y="28" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600" letter-spacing="4">PRECISION SYSTEMS ARCHITECTURE // DIGITAL TWINS // BIM</text>
  </g>

  <!-- Bottom Clean Footprint -->
  <g transform="translate(600, 440)" text-anchor="middle">
    <text fill="#64748B" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" letter-spacing="2">
      BIM / IFC WORKFLOWS &bull; REAL-TIME 3D REPLICATION &bull; DETERMINISTIC SYSTEMS
    </text>
  </g>
</svg>